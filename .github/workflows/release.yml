name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Lua and ZIP tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zip unzip

      - name: Test and package
        run: |
          lua tests/run.lua
          lua tests/addon_mock.lua
          lua tests/teleport.lua
          lua tests/teleport_mock.lua
          luac -p QueueSimulator/Core.lua
          luac -p QueueSimulator/Addon.lua
          luac -p QueueSimulator/Teleport.lua
          bash scripts/package.sh

      - name: Create release and upload addon ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/QueueSimulator-${VERSION}.zip" \
            --title "Queue Simulator ${VERSION}" \
            --generate-notes \
            --verify-tag
